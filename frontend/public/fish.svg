<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景圆角波普框 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#ffe600" stroke="#111111" stroke-width="4"/>
  <!-- 气泡 -->
  <circle cx="15" cy="18" r="4" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <circle cx="22" cy="12" r="2.5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <!-- 鱼尾巴 -->
  <path d="M46 32 L58 20 L55 32 L58 44 Z" fill="#ff4081" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
  <!-- 鱼身体 -->
  <ellipse cx="32" cy="33" rx="18" ry="14" fill="#00e5ff" stroke="#111111" stroke-width="3.5"/>
  <!-- 鱼肚与条纹 -->
  <path d="M22 36 Q32 46 44 36" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 22 Q34 32 30 42" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M36 21 Q42 32 38 41" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 鱼鳍 -->
  <path d="M30 42 Q34 50 40 46 Q36 43 34 40 Z" fill="#ff4081" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 大眼睛与高光 -->
  <circle cx="21" cy="30" r="5" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <circle cx="19.5" cy="29.5" r="2.5" fill="#111111"/>
  <circle cx="18.5" cy="28.5" r="1" fill="#ffffff"/>
  <!-- 可爱腮红 -->
  <circle cx="24" cy="37" r="2.5" fill="#ff4081" opacity="0.85"/>
  <!-- 嘴巴 -->
  <path d="M14 34 Q17 35 15 37" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
</svg>
